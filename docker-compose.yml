services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alihmedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alihmedia}
      POSTGRES_DB: alihmedia
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alihmedia -d alihmedia"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://alihmedia:${POSTGRES_PASSWORD:-alihmedia}@db:5432/alihmedia?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-ganti-secret-ini-sebelum-dipakai}
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      MAX_UPLOAD_MB: "10"
    volumes:
      - uploads:/data/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dbdata:
  uploads:
